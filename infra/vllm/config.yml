# vLLM configuration for InsightForge open-weight VLM deployment
# Used for chart/image captioning to replace Gemini Vision API calls
#
# Deployment: Qwen2-VL-7B-Instruct (vision-language) or Llama-3.2-11B-Vision
# GPU requirement: 1x A10G (24GB) for 7B, 2x A10G for 11B
#
# Usage:
#   docker run --gpus all -p 8001:8000 \
#     -e HUGGING_FACE_HUB_TOKEN=<token> \
#     vllm/vllm-openai:latest \
#     --model Qwen/Qwen2-VL-7B-Instruct \
#     --served-model-name insightforge-vlm \
#     --max-model-len 8192 \
#     --trust-remote-code \
#     --gpu-memory-utilization 0.90 \
#     --enable-prefix-caching \
#     --max-num-seqs 32

model:
  name: Qwen/Qwen2-VL-7B-Instruct
  served_name: insightforge-vlm
  dtype: bfloat16          # use float8 for 2x throughput on H100
  quantization: null       # awq | gptq | fp8 for memory savings
  max_model_len: 8192
  trust_remote_code: true

serving:
  host: 0.0.0.0
  port: 8001
  tensor_parallel_size: 1  # 2 for 11B models
  pipeline_parallel_size: 1

performance:
  gpu_memory_utilization: 0.90
  max_num_seqs: 32
  enable_prefix_caching: true   # reuse KV cache for shared prefixes
  block_size: 16

# Swap to Llama Vision for open-license requirements:
# model.name: meta-llama/Llama-3.2-11B-Vision-Instruct
# serving.tensor_parallel_size: 2

---
# InsightForge VLM client config (backend/config.py additions)
# Add to .env:
#   VLM_BASE_URL=http://localhost:8001/v1
#   VLM_MODEL=insightforge-vlm
#   VLM_ENABLED=true
