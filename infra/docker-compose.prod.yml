version: "3.9"
# Production docker-compose — all services behind Traefik
# Usage: docker compose -f infra/docker-compose.prod.yml up -d

services:

  # ── Application ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    image: insightforge/backend:latest
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://insightforge:${POSTGRES_PASSWORD}@postgres:5432/insightforge
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      qdrant:   {condition: service_started}
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits: {cpus: "2.0", memory: 2G}
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: insightforge/worker:latest
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://insightforge:${POSTGRES_PASSWORD}@postgres:5432/insightforge
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:    {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits: {cpus: "2.0", memory: 4G}

  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightforge}
      POSTGRES_DB: insightforge
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightforge"]
      interval: 10s; timeout: 5s; retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s; timeout: 5s; retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant_data:/qdrant/storage]
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=8

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s; timeout: 20s; retries: 3

  # ── Observability ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-insightforge}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/insightforge.json
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:
